#Define services
services:
  api-gateway:
    build: api-gateway
    container_name: api-gateway
    image: bookmyconsultation/api-gateway:1.0.0
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
    - "9191:9191"
    networks:
      - microservicesnet
    depends_on:
      eureka-service:
        condition: service_started
      kafka:
        condition: service_healthy
      database:
        condition: service_healthy
  appointment-service:
    build: appointment-service
    container_name: appointment-service
    image: bookmyconsultation/appointment-service:1.0.0
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
    - "8086:8086"
    networks:
      - microservicesnet
    depends_on:
      eureka-service:
        condition: service_started
      kafka:
        condition: service_healthy
      database:
        condition: service_healthy
      mongodb_container:
        condition: service_healthy
  auth-service:
    build: auth-service
    container_name: auth-service
    image: bookmyconsultation/auth-service:1.0.0
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
    - "8081:8081"
    networks:
      - microservicesnet
    depends_on:
      eureka-service:
        condition: service_started
  doc-service:
    build: doc-service
    container_name: doc-service
    image: bookmyconsultation/doctor-service:1.0.0
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
    - "8083:8083"
    networks:
      - microservicesnet
    depends_on:
      eureka-service:
        condition: service_started
      kafka:
        condition: service_healthy
      database:
        condition: service_healthy
      mongodb_container:
        condition: service_healthy
  payment-service:
    build: payment-service
    container_name: payment-service
    image: bookmyconsultation/payment-service:1.0.0
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
    - "8084:8084"
    networks:
      - microservicesnet
    depends_on:
      eureka-service:
        condition: service_started
      kafka:
        condition: service_healthy
      database:
        condition: service_healthy
      mongodb_container:
        condition: service_healthy
  rating-service:
    build: rating-service
    container_name: rating-service
    image: bookmyconsultation/rating-service:1.0.0
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
    - "8085:8085"
    networks:
      - microservicesnet
    depends_on:
      eureka-service:
        condition: service_started
      kafka:
        condition: service_healthy
      database:
        condition: service_healthy
      mongodb_container:
        condition: service_healthy
  notification-service:
    build: notification-service
    container_name: notification-service
    image: bookmyconsultation/notification-service:1.0.0
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
    - "8080:8080"
    networks:
      - microservicesnet
    depends_on:
      eureka-service:
        condition: service_started
      kafka:
        condition: service_healthy
  user-service:
    build: user-service
    container_name: user-service
    image: bookmyconsultation/user-service:1.0.0
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
    - "8082:8082"
    networks:
      - microservicesnet
    depends_on:
      eureka-service:
        condition: service_started
      kafka:
        condition: service_healthy
      database:
        condition: service_healthy
      mongodb_container:
        condition: service_healthy
  eureka-service:
    build: eureka-service
    container_name: eureka-service
    image: bookmyconsultation/eureka-service:1.0.0
    ports:
    - "8761:8761"
    networks:
      - microservicesnet
  kafka:
    image: 'apache/kafka:latest'
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - microservicesnet
  database:
    image: mysql:8.0
    container_name: database
    ports:
    - "3306:3306"
    networks:
      - microservicesnet
    environment:
      MYSQL_DATABASE: bmc
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -ppassword || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  mongodb_container:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1})' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
networks:
  microservicesnet:
    driver: bridge
